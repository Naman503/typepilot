name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android (unit tests + debug and release builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build
        # No signing secrets here, so the release build uses the debug key (never published).
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/

  mac:
    name: Mac (build + tests)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Tests
        run: swift test
